<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>form pendaftaran</title>
  </head>
  <body>
    <h1>
      <strong><u>Form Pendaftaran siswa baru</u></strong>
    </h1>
    <form>
      <fieldset>
        <legend>Data Diri</legend>
        <label for="Nama Lengkap">Nama Lengkap : </label>
        <input type="Nama" name="nama" />
        <br />
        <br />
        <label for="Tanggal lahir">Tanggal Lahir :</label>
        <input type="date" required />
        <br />
        <br />
        <label for=" Jenis Kelamin"> Jenis Kelamin :</label>
        <input type="radio" name="Gender" /> Laki-Laki
        <input type="radio" name="Gender" /> Perempuan
        <br />
        <br />
        <label for="Asal sekolah">Asal Sekolah :</label>
        <input type="text" name="text" />
        <br />
        <br />
        <label for="Kelas">Kelas :</label>
        <input type="text" name="Kelas" />
        <br />
        <br />
        <label for="No telepon">No Telepon :</label>
        <input type="number" name="No telepon" />
        <br />
        <br />
        <label for="Nama Orang tua">Nama Orang Tua</label>
        <input type="text" name="Name" />
        <br />
        <br />
        <label for="Pekerjaan Orang Tua">Pekerjaan Orang Tua</label>
        <input type="text" />
        <br />
        <br />
        <label for="Progam Kursus">Program Kursus :</label>
        <input type="text" />
        <br />
        <br />
        <label for="Hari Kursus">Hari Kursus :</label>
        <input type="radio" name="Hari Kursus" /> Senin & Kamis
        <input type="radio" name="Hari Kursus" /> Selasa & Jumat
        <input type="radio" name="Hari Kursus" /> Rabu & Sabtu
        <br />
        <br />
        <label for="Waktu Kursus">Waktu Kursus :</label>
        <input type="radio" name="waktu kursus" /> 14:00 - 15:30
        <input type="radio" name="waktu kursus" /> 16:00 - 17:30
        <input type="radio" name="waktu kursus" /> 19:00 - 20:30
        <br />
        <br />
        <button type="submit">Kirim</button>
      </fieldset>
    </form>
  </body>
</html>
