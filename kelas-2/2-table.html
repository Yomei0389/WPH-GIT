<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>class 2 - table</title>
  </head>
  <body>
    <!--table-->
    <table border="1">
      <tr>
        <th>No.</th>
        <th>nama</th>
        <th>Kelas</th>
      </tr>
      <tr>
        <td>1</td>
        <td>Yoseph</td>
        <td>btach sou</td>
      </tr>
</table>

      <br/>

      <!--struktur semantic-->
<table border="1"
<caption> Table percobaan pertama</caption>
<thead align="center">
  <tr>
    <th rowspan="2">no</th>
    <th rowspan="2">produk</th>
    <th colspan="3">penjualan</th>
    </tr>
    <tr>
    <th>januari</th>
    <th>februari</th>
    <th>Maret</th>
    </tr>
</thead>
<tbody align="left">
  <tr>
    <td>1</td>
    <td>aqua</td>
    <td>100jt</td>
    <td>200jt</td>
    <td>50</td>
  </tr>
</tbody>
<tfoot>
  <tr>
    <td colspan="2">Total data : 1 baris</td>
  </tr>
</tfoot>
    </table>
  </body>
</html>
