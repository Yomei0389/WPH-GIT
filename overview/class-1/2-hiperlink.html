<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>class-1 tag hyperlink</title>
  </head>
  <body>
    <h1>tag hyperlink</h1>
    <!--hyperlink dgn contoh sederhana-->
    <nav>
      <ul>
        <li>
          <a href="https://www.instagram.com">buka instagram</a>
        </li>
        <br />
        <li><a href="./1-teks.html">buka materi teks</a></li>
        <br />

        <!--hyperlink dengan contoh attribute target-->
        <li>
          <a href="https://www.youtube.com" target="_blank">buka youtube</a>
        </li>
        <br />

        <!--hyperlink dengan contoh atribut title-->
        <li>
          <a
            href="https://www.google.com"
            target="_blank"
            title="klik dsini yuk"
            >buka tab google</a
          >
        </li>
        <br />
        <!--hyperlink dengan contoh buka email-->
        <li><a href="mailto:info@example.com">test email</a></li>
        <br />
        <!--hyeplink dengan contoh buka no telp-->
        <li><a href="tel:+6281703800046">test no hape</a></li>
      </ul>
    </nav>
    <br />
    <br />
    <button type="button"><a href="../index.html">back to main menu</a></button>
  </body>
</html>
